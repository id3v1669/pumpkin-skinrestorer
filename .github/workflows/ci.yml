name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Unit tests, rustfmt and clippy.
      - run: nix flake check -L
      # The plugin component.
      - run: nix build -L
