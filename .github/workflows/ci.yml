name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31
      # Unit tests, rustfmt and clippy.
      - run: nix flake check -L
      # The plugin component.
      - run: nix build -L
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skinrestorer-wasm
          path: result/lib/skinrestorer.wasm
          if-no-files-found: error
      # Known vulnerabilities in the locked dependencies.
      - run: nix shell --inputs-from . nixpkgs#cargo-audit -c cargo-audit audit
