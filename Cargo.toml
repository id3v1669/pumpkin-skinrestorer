[package]
name = "pumpkin-skinrestorer"
version = "0.1.0"
edition = "2024"
authors = ["id3v1669"]
repository = "https://github.com/id3v1669/pumpkin-skinrestorer"
license = "GPL-3.0-only"
description = "Ely.by and Mojang skins for the Pumpkin Minecraft server"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.23", default-features = false, features = ["parse", "display"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "async", "realloc"] }
wasi = "0.14"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
